function curAt(t) {
  let x = MOVES[0][2], y = MOVES[0][3];
  for (const [a, b, nx, ny] of MOVES) { if (t < a) break; const p = b > a ? io(seg(t, a, b)) : 1; x = lerp(x, nx, p); y = lerp(y, ny, p); }
  return [x, y];
}
// press: a smooth dip in [a - .05, a + .09], peak at a + .015
const pressAt = (t, a) => { const d = t - a; return d > -.05 && d < .09 ? clamp(1 - Math.abs(d - .015) / .065) : 0; };
const show = (el, v) => { el.style.display = v > .001 ? '' : 'none'; };

window.setT = function (t) {
  // the rail, the info and the bottom gradient fade under the opening sheet and stay gone
  const hc = io(seg(t, T_SHEET + .02, T_SHEET + .22));
  const g = clamp(seg(t, T0, T0 + .3));
  $('gtop').style.opacity = g; $('gbot').style.opacity = g * (1 - hc);
  // top: status + Reels title + camera drop in
  [['status', 0], ['rtitle', .04], ['rcam', .08]].forEach(([id, d]) => {
    const q = SV(t - T0 - d, 16, .6), el = $(id);
    el.style.transform = `translateY(${-26 * (1 - q)}px)`; el.style.opacity = clamp(q * 1.4);
  });
  // rail: icons slide in from the right one by one, audio square last
  railIt.forEach((el, i) => {
    const q = SV(t - T0 - (.06 + i * .05), 15, .65);
    el.style.transform = `translateX(${70 * (1 - q)}px)`; el.style.opacity = clamp(q * 1.5) * (1 - hc);
  });
  { const q = SV(t - T0 - .26, 15, .65); $('audio').style.transform = `translateX(${70 * (1 - q)}px) rotate(${(t * 40) % 360}deg)`; $('audio').style.opacity = clamp(q * 1.5) * (1 - hc); }
  // info block rises row by row
  infoIt.forEach((el, i) => {
    const q = SV(t - T0 - (.14 + i * .05), 15, .6);
    el.style.transform = `translateY(${24 * (1 - q)}px)`; el.style.opacity = clamp(q * 1.4) * (1 - hc);
  });
  $('prog').style.opacity = clamp(seg(t, T0 + .15, T0 + .35)) * (1 - hc);
  $('progi').style.width = (58 + 2.2 * t) + '%';

  // comment icon press (a dip, no pop) + the count rolls when the comment is posted
  $('comsvg').style.transform = `scale(${1 - .2 * pressAt(t, TAP_COM)})`;
  const roll = out(seg(t, T_POST + .02, T_POST + .16));
  $('cc0').style.transform = `translateY(${-16 * roll}px)`; $('cc0').style.opacity = 1 - .6 * roll;
  $('cc1').style.transform = `translateY(${16 * (1 - roll)}px)`; $('cc1').style.opacity = .4 + .6 * roll;

  // sheet slides up over the bottom of the reel (the face stays in the clear), 8 % dim at most
  const ps = SV(t - T_SHEET, 15, .6);
  $('sheet').style.transform = `translateY(${(1 - ps) * 290}px)`; show($('sheet'), ps);
  $('dim').style.opacity = .08 * ps; show($('dim'), ps);
  const hq = S(t - (T_SHEET + .06), 18);
  $('stitle').style.opacity = hq; $('splane').style.opacity = hq;

  // list: the viewer's comment is pinned on top, every other new comment slides in right under it
  const pn = SV(t - T_POST, 16, .5);
  const pf = FLOOD.map(([a]) => SV(t - a, 16, .5));
  floodRows.forEach((r, k) => {
    const p = pf[k]; show(r, p);
    let above = pn; for (let j = k + 1; j < FLOOD.length; j++) above += pf[j];   // newer rows sit above this one
    r.style.top = (LIST_TOP + above * ROW_H) + 'px';
    r.style.opacity = clamp((p - .08) / .45);
    r.style.clipPath = `inset(0 0 ${(1 - p) * ROW_H}px 0)`;
  });
  const fsum = pf.reduce((a, b) => a + b, 0);
  oldRows.forEach((r, i) => {
    const q = S(t - (T_SHEET + .08 + i * .04), 18);
    const y = LIST_TOP + (i + pn + fsum) * ROW_H + (1 - q) * 14;
    r.style.top = y + 'px'; r.style.opacity = q; show(r, q * (y < 200 ? 1 : 0));
  });
  newRow.style.display = t >= T_POST ? '' : 'none';
  newRow.style.top = LIST_TOP + 'px'; newRow.style.opacity = clamp((pn - .08) / .45);
  newRow.style.clipPath = `inset(0 0 ${(1 - pn) * ROW_H}px 0)`;
  // the creator likes it on « suis »: the heart dips, fills red, the count reads 1
  const liked = t >= T_LIKE;
  nHo.style.display = liked ? 'none' : ''; nHf.style.display = liked ? '' : 'none'; nLk.textContent = liked ? '1' : '';
  nHf.style.transform = `scale(${.6 + .4 * S(t - T_LIKE, 22)})`;
  nLike.style.transform = `scale(${1 - .18 * pressAt(t, T_LIKE - .03)})`;
  newRow.querySelector('.hl').style.opacity = Math.max(clamp(pn * 2) * (1 - io(seg(t, 3.4, 3.9))), .7 * flash(t, T_LIKE));

  // field: tapped, « KITCHEN » typed letter by letter, Publier lights up, cleared after the post
  const focused = t >= TAP_FIELD + .02 && t < TAP_PUB + .02, cleared = t >= TAP_PUB + .03;
  let n = 0;
  letters.forEach((s, i) => {
    const on = t >= TYPE[i] && !cleared; if (on) n++;
    const q = S(t - TYPE[i], 45);
    s.style.display = on ? '' : 'none'; s.style.transform = `translateY(${(1 - q) * 3}px)`; s.style.opacity = .3 + .7 * q;
  });
  $('ph').style.display = n ? 'none' : '';
  const typing = t >= TYPE[0] && t < TYPE[TYPE.length - 1] + .12;
  $('caret').style.opacity = focused && (typing || Math.floor((t - TAP_FIELD) * 2.4) % 2 === 0) ? 1 : 0;
  $('ph').style.left = (focused ? 18 : 15) + 'px';
  $('field').style.borderColor = focused ? '#555' : '#3c3c3c';
  const pon = cleared ? 0 : SV(t - T_PUB_ON, 26, .8), pp = pressAt(t, TAP_PUB);
  $('pub').style.opacity = (.35 + .65 * pon) * (1 - .45 * pp);
  $('pub').style.transform = `scale(${1 - .08 * pp})`;

  // DM badge on the sheet's paper plane on « DM »
  const db = S(t - T_DM, 20);
  show($('dmb'), db); $('dmb').style.opacity = clamp(db * 1.6); $('dmb').style.transform = `scale(${.55 + .45 * db})`;

  // iOS banners: each drops in, the older ones slide back into a stack behind the newest (the face stays clear)
  const bq = BAN_T.map(a => SV(t - a, 13, .6));
  bans.forEach((el, i) => {
    const b = bq[i]; show(el, b);
    let d = 0; for (let j = i + 1; j < bans.length; j++) d += S(t - BAN_T[j], 13);   // depth in the stack
    el.style.zIndex = 40 + i;
    el.style.transform = `translateY(${-130 * (1 - b) + 13 * d}px) scale(${(.97 + .03 * b) * (1 - .05 * d)})`;
    el.style.opacity = clamp(b * 3);
    el.style.background = `rgb(${32 + 10 * Math.min(d, 2)},${32 + 10 * Math.min(d, 2)},${32 + 10 * Math.min(d, 2)})`;
    banIn[i].forEach(c => { c.style.opacity = clamp(1 - d * 1.6); });
  });
  $('status').style.opacity = (1 - clamp(bq[0] * 1.4)) * clamp(SV(t - T0, 16, .6) * 1.4);

  // finger dot + ripples
  const [cx, cy] = curAt(t);
  let press = 0; for (const a of TAPS) press = Math.max(press, pressAt(t, a));
  const vis = clamp(seg(t, .94, 1.06) - seg(t, 2.08, 2.28));
  show($('dot'), vis);
  $('dot').style.transform = `translate(${cx}px,${cy}px) scale(${1 - .16 * press})`;
  $('dot').style.opacity = vis; $('dot').style.background = `rgba(255,255,255,${.32 + .3 * press})`;
  const rips = TAPS.filter(a => t >= a && t < a + .42).slice(-2);
  [0, 1].forEach(i => {
    const el = $('rip' + i), a = rips[i];
    if (a === undefined) { el.style.display = 'none'; return; }
    const p = out((t - a) / .42), [rx, ry] = curAt(a);
    el.style.display = ''; el.style.transform = `translate(${rx}px,${ry}px) scale(${.45 + .85 * p})`; el.style.opacity = .85 * (1 - p);
  });
  return true;
};
// a short blue flash on the liked row: rises with a spring, fades out over .6 s (monotonic in, monotonic out)
function flash(t, a) { return S(t - a, 30) * (1 - io(seg(t, a + .25, a + .85))); }
window.setT(0);
</script></body></html>
