});

// the viewer's finger: [t0, t1, x, y] eased moves (CSS px); it drifts to Publier while the letters are typed
const COM = [357, 495], FIELD = [170, 681], PUB = [348, 681];
const MOVES = [[0, 0, 318, 600], [.04, .27, COM[0], COM[1]], [.40, .58, FIELD[0], FIELD[1]], [.86, 1.16, PUB[0], PUB[1]], [1.36, 1.60, 320, 770]];
const TAPS = [TAP_COM, TAP_FIELD, TAP_PUB];
function curAt(t) {
  let x = MOVES[0][2], y = MOVES[0][3];
  for (const [a, b, nx, ny] of MOVES) { if (t < a) break; const p = b > a ? io(seg(t, a, b)) : 1; x = lerp(x, nx, p); y = lerp(y, ny, p); }
  return [x, y];
}
const pressAt = (t, a) => { const d = t - a; return d > -.05 && d < .09 ? clamp(1 - Math.abs(d - .015) / .065) : 0; };
const show = (el, v) => { el.style.display = v > .001 ? '' : 'none'; };

window.setT = function (t) {
  // the chrome is there from the first frame (a quick settle), the rail and the info fade under the opening sheet
  const hc = io(seg(t, T_SHEET + .02, T_SHEET + .2));
  const g = clamp(seg(t, 0, .16));
  $('gtop').style.opacity = g; $('gbot').style.opacity = g * (1 - hc);
  [['status', 0], ['rtitle', .02], ['rcam', .04]].forEach(([id, d]) => {
    const q = SV(t - d, 22, .7), el = $(id);
    el.style.transform = `translateY(${-14 * (1 - q)}px)`; el.style.opacity = clamp(q * 1.5);
  });
  railIt.forEach((el, i) => {
    const q = SV(t - i * .025, 22, .7);
    el.style.transform = `translateX(${36 * (1 - q)}px)`; el.style.opacity = clamp(q * 1.6) * (1 - hc);
  });
  { const q = SV(t - .08, 22, .7); $('audio').style.transform = `translateX(${36 * (1 - q)}px) rotate(${(t * 40) % 360}deg)`; $('audio').style.opacity = clamp(q * 1.6) * (1 - hc); }
  infoIt.forEach((el, i) => {
    const q = SV(t - (.02 + i * .03), 22, .7);
    el.style.transform = `translateY(${16 * (1 - q)}px)`; el.style.opacity = clamp(q * 1.5) * (1 - hc);
  });
  $('comsvg').style.transform = `scale(${1 - .2 * pressAt(t, TAP_COM)})`;

  // sheet slides up over the bottom of the reel (the face stays in the clear), an 8 % dim at most on the reel
  const ps = SV(t - T_SHEET, 18, .6);
  $('sheet').style.transform = `translateY(${(1 - ps) * 290}px)`; show($('sheet'), ps);
  $('dim').style.opacity = .08 * ps; show($('dim'), ps);
  const hq = S(t - (T_SHEET + .05), 20);
  $('stitle').style.opacity = hq; $('splane').style.opacity = hq;

  // list: your comment slides in on top on Publier and stays pinned there, the other followers' FINDER land under it
  const pn = SV(t - T_POST, 16, .5), po = T_OTHER.map(a => SV(t - a, 15, .5)), pos = po[0] + po[1];
  oldRows.forEach((r, i) => {
    const q = S(t - (T_SHEET + .08 + i * .04), 18);
    r.style.top = (LIST_TOP + (i + pn + pos) * ROW_H + (1 - q) * 14) + 'px'; r.style.opacity = q;
  });
  const slotIn = (r, p, top) => {
    r.style.display = p > 0 ? '' : 'none';
    r.style.top = top + 'px'; r.style.opacity = clamp((p - .08) / .45);
    r.style.clipPath = `inset(0 0 ${(1 - p) * ROW_H}px 0)`;
    r.style.transform = `scale(${.97 + .03 * p})`; r.style.transformOrigin = '20% 0%';
  };
  slotIn(newRow, pn, LIST_TOP);
  slotIn(others[1], po[1], LIST_TOP + ROW_H);
  slotIn(others[0], po[0], LIST_TOP + ROW_H + po[1] * ROW_H);
  newRow.querySelector('.hl').style.opacity = clamp(pn * 2) * (1 - .5 * io(seg(t, 3.0, 3.6)));
  // toncompte likes your comment (the red heart fills in) during the hold
  const lq = S(t - T_LIKE, 20);
  nh1.style.opacity = lq; nh0.style.opacity = 1 - lq;
  nhw.style.transform = `scale(${1 + .28 * bump(t - T_LIKE, .08)})`;
  nlk.textContent = t >= T_LIKE ? '1' : ''; nlk.style.opacity = lq;

  // field: tapped, FINDER typed letter by letter on « FINDER », Publier lights up, cleared after the post
  const focused = t >= TAP_FIELD + .02 && t < TAP_PUB + .02, cleared = t >= TAP_PUB + .03;
  let n = 0;
  letters.forEach((s, i) => {
    const on = t >= TYPE[i] && !cleared; if (on) n++;
    const q = S(t - TYPE[i], 45);
    s.style.display = on ? '' : 'none'; s.style.transform = `translateY(${(1 - q) * 3}px) scale(${.7 + .3 * q})`; s.style.opacity = .3 + .7 * q;
  });
  $('ph').style.display = n ? 'none' : '';
  const typing = t >= TYPE[0] && t < TYPE[TYPE.length - 1] + .12;
  $('caret').style.opacity = focused && (typing || Math.floor((t - TAP_FIELD) * 2.4) % 2 === 0) ? 1 : 0;
  $('ph').style.left = (focused ? 18 : 15) + 'px';
  $('field').style.borderColor = focused ? '#555' : '#3c3c3c';
  const pon = cleared ? 0 : S(t - T_PUB_ON, 26), pp = pressAt(t, TAP_PUB);
  $('pub').style.opacity = (.35 + .65 * pon) * (1 - .45 * pp);
  $('pub').style.transform = `scale(${1 - .08 * pp})`;

  // DM banners drop in from the top; each new one lands on top and the older ones tuck behind it (iOS stack)
  const bq = T_BAN.map(a => SV(t - a, 13, .6));
  const under = 1 - clamp(bq[0] * 1.4);   // the status bar and the Reels header go under the first banner
  $('status').style.opacity = under * clamp(SV(t, 22, .7) * 1.5);
  $('rtitle').style.opacity = under * clamp(SV(t - .02, 22, .7) * 1.5); $('rcam').style.opacity = under * clamp(SV(t - .04, 22, .7) * 1.5);
  BANS.forEach((b, i) => {
    const q = bq[i]; show(b, q);
    let depth = 0; for (let j = i + 1; j < BANS.length; j++) depth += bq[j];
    b.style.transform = `translateY(${-150 * (1 - q) + 9 * depth}px) scale(${.96 + .04 * q - .055 * depth})`;
    b.style.opacity = clamp(q * 3) * (1 - clamp(depth - 1.4));
    const c = 1 - clamp((depth - .3) * 2.5);
    b.querySelectorAll('.tx,.av,.badge,.when,.thumb').forEach(e => e.style.opacity = c);
    b.querySelector('.shade').style.opacity = .3 * clamp(depth);
  });

  // finger dot + ripples
  const [fx, fy] = curAt(t);
  let press = 0; for (const a of TAPS) press = Math.max(press, pressAt(t, a));
  const vis = clamp(seg(t, .02, .12) - seg(t, 1.38, 1.56));
  show($('dot'), vis);
  $('dot').style.transform = `translate(${fx}px,${fy}px) scale(${1 - .16 * press})`;
  $('dot').style.opacity = vis; $('dot').style.background = `rgba(255,255,255,${.32 + .3 * press})`;
  const rips = TAPS.filter(a => t >= a && t < a + .42).slice(-2);
  [0, 1].forEach(i => {
    const el = $('rip' + i), a = rips[i];
    if (a === undefined) { el.style.display = 'none'; return; }
    const p = out((t - a) / .42), [rx, ry] = curAt(a);
    el.style.display = ''; el.style.transform = `translate(${rx}px,${ry}px) scale(${.45 + .85 * p})`; el.style.opacity = .85 * (1 - p);
  });
  return true;
};
window.setT(0);
</script></body></html>
