<!doctype html>
<html><head><meta charset="utf-8">
<!-- Short 3.32-4.99 s: "Ça s'appelle Thinking Orbs, et c'est toute une..."
     A GitHub repo card (Jakubantalik / thinking-orbs, live real orb as social preview, stars counting to 3,651),
     then the npm strip (npm install thinking-orbs typed, MIT + v0.3.2 badges).
     Split layout: draws only in x 60-1020, y 80-1040. Every state is a pure function of t in window.setT(t). -->
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; overflow: hidden; }
  .gh { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: #1F2328; }
  .card { position: absolute; left: 60px; width: 960px; background: #FFFFFF; border-radius: 32px; overflow: hidden;
    box-shadow: 0 30px 70px -22px rgba(40,28,10,.30), 0 10px 22px -8px rgba(40,28,10,.16), 0 1.5px 3px rgba(40,28,10,.12), 0 0 0 1.5px rgba(31,35,40,.06); }
  .lit { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0) 75%, rgba(60,44,20,.018) 100%); box-shadow: inset 0 2.5px 0 rgba(255,255,255,.6); }
  #A { top: 78px; height: 490px; }
  #B { top: 608px; height: 430px; }
  .abs { position: absolute; }
  .row { position: absolute; display: flex; align-items: center; white-space: nowrap; }
  .ico { display: block; flex: none; }
  /* GitHub header */
  #hdr { position: absolute; left: 0; top: 0; right: 0; height: 120px; border-bottom: 2px solid #D1D9E0; background: #F6F8FA; }
  #octo { position: absolute; left: 36px; top: 28px; width: 64px; height: 64px; }
  #path { left: 122px; top: 60px; transform: translateY(-50%); font-size: 42px; gap: 0; }
  #path .sl { color: #59636E; margin: 0 14px; }
  #repo { position: relative; font-weight: 600; }
  #repoHl { position: absolute; left: -10px; top: -4px; bottom: -4px; border-radius: 10px; background: rgba(37,142,255,.14); box-shadow: inset 0 0 0 2.5px rgba(37,142,255,.7); }
  #repoT { position: relative; }
  #pub { margin-left: 22px; font-size: 34px; font-weight: 500; color: #59636E; border: 2px solid #D1D9E0; border-radius: 999px; padding: 2px 20px; line-height: 42px; background: #FFFFFF; }
  /* body */
  #tile { position: absolute; left: 36px; top: 152px; width: 302px; height: 302px; box-sizing: border-box; border: 2px solid #D1D9E0; border-radius: 26px; background: #FFFFFF; overflow: hidden; }
  #orb { position: absolute; left: 9px; top: 9px; width: 280px; height: 280px; }
  #desc { position: absolute; left: 376px; top: 158px; width: 550px; font-size: 40px; line-height: 54px; color: #59636E; }
  #desc b { color: #1F2328; font-weight: 600; }
  #starRow { left: 376px; top: 382px; height: 72px; gap: 18px; }
  .btn { display: flex; align-items: center; gap: 14px; height: 72px; box-sizing: border-box; padding: 0 22px; border-radius: 14px;
    background: #F6F8FA; border: 2px solid #D1D9E0; font-size: 36px; font-weight: 600; box-shadow: 0 2px 0 rgba(31,35,40,.04); }
  #cnt { display: inline-block; min-width: 116px; text-align: center; font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 600;
    padding: 0 12px; line-height: 46px; border-radius: 999px; background: rgba(129,139,152,.16); }
  /* npm */
  #npmLogo { position: absolute; left: 40px; top: 38px; width: 84px; height: 84px; border-radius: 6px; }
  #pkg { left: 150px; top: 80px; transform: translateY(-50%); gap: 20px; }
  #pkg .nm { font-size: 48px; font-weight: 700; letter-spacing: -.3px; }
  #pkg .pb { font-size: 34px; color: #59636E; }
  #term { position: absolute; left: 40px; top: 156px; width: 880px; height: 120px; border-radius: 24px; background: #16181D;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); }
  #cmd { position: absolute; left: 38px; top: 60px; transform: translateY(-50%); font-family: "JetBrains Mono"; font-size: 40px; font-weight: 500; color: #F5F6F8; white-space: pre; display: flex; align-items: center; }
  #cmd .pr { color: #7D8590; }
  #caret { display: inline-block; width: 22px; height: 46px; margin-left: 3px; background: #258EFF; border-radius: 3px; }
  #badges { left: 40px; top: 350px; transform: translateY(-50%); gap: 20px; }
  .bdg { display: flex; align-items: center; gap: 12px; height: 70px; box-sizing: border-box; padding: 0 24px; border-radius: 999px; font-size: 36px; font-weight: 600; }
  #mit { color: #258EFF; background: rgba(37,142,255,.10); box-shadow: inset 0 0 0 2.5px #258EFF; }
  #ver { color: #1F2328; background: #F6F8FA; box-shadow: inset 0 0 0 2px #D1D9E0; }
</style></head>
<body><div id="stage">
  <div class="card gh" id="A">
    <div id="hdr"></div>
    <img id="octo" src="../assets/logos/github.png">
    <div class="row" id="path"><span>Jakubantalik</span><span class="sl">/</span><span id="repo"><i id="repoHl"></i><span id="repoT">thinking-orbs</span></span><span id="pub">Public</span></div>
    <div id="tile"><canvas id="orb" width="280" height="280"></canvas></div>
    <div id="desc">Animated dotted <b>orbs</b> that replace your loading spinners.</div>
    <div class="row" id="starRow">
      <div class="btn" id="star"><svg class="ico" id="starIco" width="36" height="36" viewBox="0 0 16 16"><path id="starO" fill="#59636E" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z"/><path id="starF" fill="#E3B341" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg><span id="starT">Star</span><span id="cnt">0</span></div>
    </div>
    <div class="lit"></div>
  </div>
  <div class="card gh" id="B">
    <img id="npmLogo" src="../assets/logos/npm.svg">
    <div class="row" id="pkg"><span class="nm">thinking-orbs</span><span class="pb">Public</span></div>
    <div id="term"><div id="cmd"><span class="pr">$ </span><span id="typed"></span><i id="caret"></i></div></div>
    <div class="row" id="badges">
      <div class="bdg" id="mit"><svg class="ico" width="36" height="36" viewBox="0 0 16 16" fill="#258EFF"><path d="M8.75.75V2h.985c.304 0 .603.08.867.231l1.29.736c.038.022.08.033.124.033h2.234a.75.75 0 0 1 0 1.5h-.427l2.111 4.692a.75.75 0 0 1-.154.838l-.53-.53.529.531-.001.002-.002.002-.006.006-.006.005-.01.01-.045.04c-.21.176-.441.327-.686.45C14.556 10.780 13.880 11 13 11a4.498 4.498 0 0 1-2.023-.454 3.544 3.544 0 0 1-.686-.45l-.045-.04-.016-.015-.006-.006-.004-.004v-.001a.75.75 0 0 1-.154-.838L12.178 4.5h-.162c-.305 0-.604-.079-.868-.231l-1.29-.736a.245.245 0 0 0-.124-.033H8.75V13h2.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1 0-1.5h2.5V3.5h-.984a.245.245 0 0 0-.124.033l-1.289.737c-.265.15-.564.23-.869.23h-.162l2.112 4.692a.75.75 0 0 1-.154.838l-.53-.53.529.531-.001.002-.002.002-.006.006-.016.015-.045.04c-.21.176-.441.327-.686.45C4.556 10.78 3.88 11 3 11a4.498 4.498 0 0 1-2.023-.454 3.544 3.544 0 0 1-.686-.45l-.045-.04-.016-.015-.006-.006-.004-.004v-.001a.75.75 0 0 1-.154-.838L2.178 4.5H1.75a.75.75 0 0 1 0-1.5h2.234a.249.249 0 0 0 .125-.033l1.288-.737c.265-.15.564-.23.869-.23h.984V.75a.75.75 0 0 1 1.5 0Zm2.945 8.477c.285.135.718.273 1.305.273s1.02-.138 1.305-.273L13 6.327Zm-10 0c.285.135.718.273 1.305.273s1.02-.138 1.305-.273L3 6.327Z"/></svg>MIT license</div>
      <div class="bdg" id="ver"><svg class="ico" width="34" height="34" viewBox="0 0 16 16" fill="#59636E"><path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>v0.3.2</div>
    </div>
    <div class="lit"></div>
  </div>
</div>
<script src="orbs.js"></script>
<script>
const $ = id => document.getElementById(id);
const S = (x, w) => x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const L = (a, b, k) => a + (b - a) * k;
const mix = (a, b, k) => `rgb(${a.map((c, i) => Math.round(L(c, b[i], k)))})`;

// real orb: "searching" (globe) drawn at its logical size (base profile), dense like the demo site
const octx = $('orb').getContext('2d');
const SEARCH = ORBS.resolvePreset('searching', 64);
function orb(t) {
  octx.setTransform(1.4, 0, 0, 1.4, 0, 0); octx.clearRect(0, 0, 200, 200);   // logical 200, drawn 280 px
  ORBS.paintFrame(octx, ORBS.MODE_FRAMES[SEARCH.mode](200, (t + 0.6) * SEARCH.speed, { ...ORBS.BASE_PROFILES[SEARCH.mode] }), false);
}
const CMD = 'npm install thinking-orbs';
const enter = (el, k, dy) => { el.style.opacity = Math.min(1, k * 1.4); el.style.transform = (el.dataset.base || '') + ` translateY(${(1 - k) * dy}px)`; };
['badges'].forEach(id => $(id).dataset.base = 'translateY(-50%)');

window.setT = function (t) {
  // card A is there at frame 0, a .15 s settle
  const a = S(t + 0.05, 34);
  $('A').style.transform = `translateY(${(1 - a) * 16}px)`;
  orb(t);

  // "Thinking" .42: the repo name lights up blue, a highlight sweeps left to right behind it
  const h = S(t - 0.42, 20), rt = $('repoT');
  $('repoHl').style.width = (rt.offsetWidth + 20) * h + 'px'; $('repoHl').style.opacity = Math.min(1, h * 2);
  rt.style.color = mix([31, 35, 40], [37, 142, 255], h);

  // stars .50 -> 1.00: the counter rolls up to 3,651, then the star fills gold
  const p = cl((t - 0.5) / 0.5), e = 1 - Math.pow(1 - p, 3);
  $('cnt').textContent = Math.round(3651 * e).toLocaleString('en-US');
  const f = S(t - 1.0, 22);
  $('starF').style.opacity = f; $('starO').style.opacity = 1 - f;
  $('starT').textContent = t >= 1.0 ? 'Starred' : 'Star';

  // npm card slides up at .62, the command types .85 -> 1.30
  enter($('B'), S(t - 0.62, 18), 46);
  const n = Math.round(CMD.length * cl((t - 0.85) / 0.45));
  $('typed').textContent = CMD.slice(0, n);
  const typing = t > 0.8 && t < 1.32;
  $('caret').style.opacity = t < 0.62 ? 0 : (typing ? 1 : (Math.floor(t * 2.5) % 2 ? 0.25 : 1));

  // badges: MIT 1.38 ("toute"), version 1.52 ("une")
  enter($('mit'), S(t - 1.38, 22), 22);
  enter($('ver'), S(t - 1.52, 22), 22);
};
window.setT(0);
</script>
</body></html>
