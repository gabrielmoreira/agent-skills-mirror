const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

const S = (x, w = 14) => x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x);

const SV = (x, w = 14, k = .6) => x <= 0 ? 0 : 1 - (1 + w * (1 - k) * x) * Math.exp(-w * x);
const out = p => 1 - Math.pow(1 - p, 3), io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

window.setT = function (t) {
  // the rail, the info and the bottom gradient fade under the opening sheet, and come back once it goes down
  const hc = io(seg(t, T_SHEET + .02, T_SHEET + .2)) * (1 - io(seg(t, T_BACK, T_BACK + .24)));
  $('gbot').style.opacity = 1 - .6 * hc;
  railIt.forEach(el => { el.style.opacity = 1 - hc; });
  $('audio').style.opacity = 1 - hc;
  infoIt.forEach((el, i) => {
    const back = S(t - (T_BACK + i * .04), 18);
    el.style.opacity = t < T_BACK ? 1 - hc : back; el.style.transform = `translateY(${t < T_BACK ? 0 : 10 * (1 - back)}px)`;
  });
  $('prog').style.opacity = 1 - hc;
  $('progi').style.width = (62 + 3 * t) + '%';

  // comment icon press + the count rolls when the comment is posted
  $('comsvg').style.transform = `scale(${1 - .18 * pressAt(t, TAP_COM)})`;
  const roll = out(seg(t, T_POST + .02, T_POST + .16));
  $('cc0').style.transform = `translateY(${-17 * roll}px)`; $('cc0').style.opacity = 1 - roll;
  $('cc1').style.transform = `translateY(${17 * (1 - roll)}px)`; $('cc1').style.opacity = roll;

  // follow: tapped on « suis », Suivre turns into a grey Abonné(e) with a check, the button widens
  const fp = pressAt(t, TAP_FOL), fq = S(t - (TAP_FOL + .03), 22);
  $('follow').style.width = lerp(FW0, FW1, fq) + 'px';
  $('follow').style.transform = `scale(${1 - .07 * fp})`;
  $('follow').querySelector('.fb').style.opacity = 1 - fq;
  $('follow').querySelector('.fg').style.opacity = fq;
  $('fl0').style.opacity = clamp(1 - fq * 2.2); $('fl0').style.transform = `translateY(${-5 * fq}px)`;
  $('fl1').style.opacity = clamp(fq * 1.6 - .4); $('fl1').style.transform = `translateY(${5 * (1 - fq)}px)`;

  // sheet slides up over the bottom of the reel (the face stays in the clear), a 6 % dim on the reel, down on « du »
  const ps = SV(t - T_SHEET, 22, .6) * (1 - io(seg(t, T_SHEET_OUT, T_SHEET_OUT + .26)));
  $('sheet').style.transform = `translateY(${(1 - ps) * 270}px)`; show($('sheet'), ps);
  $('dim').style.opacity = .06 * ps; show($('dim'), ps);
  const hq = S(t - (T_SHEET + .05), 24);
  $('stitle').style.opacity = hq; $('splane').style.opacity = hq;

  // new comment: the list slides down and the viewer's row fills the slot
  const pn = SV(t - T_POST, 22, .5);
  oldRows.forEach((r, i) => {
    const q = S(t - (T_SHEET + .06 + i * .03), 24);
    r.style.top = (LIST_TOP + (i + pn) * ROW_H + (1 - q) * 14) + 'px'; r.style.opacity = q;
  });
  newRow.style.display = t >= T_POST ? '' : 'none';
  newRow.style.top = LIST_TOP + 'px'; newRow.style.opacity = clamp((pn - .08) / .45);
  newRow.style.clipPath = `inset(0 0 ${(1 - pn) * ROW_H}px 0)`;
  newRow.style.transform = `scale(${.97 + .03 * pn})`; newRow.style.transformOrigin = '20% 0%';
  newRow.querySelector('.hl').style.opacity = clamp(pn * 2);

  // field: focused as the sheet lands, « ORBES » typed letter by letter, Publier lights up, cleared after the post
  const focused = t >= T_SHEET + .14 && t < TAP_PUB + .02, cleared = t >= TAP_PUB + .03;
  let n = 0;
  letters.forEach((s, i) => {
    const on = t >= TYPE[i] && !cleared; if (on) n++;
    const q = S(t - TYPE[i], 45);
    s.style.display = on ? '' : 'none'; s.style.transform = `translateY(${(1 - q) * 3}px)`; s.style.opacity = .3 + .7 * q;
  });
  $('ph').style.display = n ? 'none' : '';
  $('caret').style.opacity = focused ? 1 : 0;
  $('ph').style.left = (focused ? 18 : 15) + 'px';
  $('field').style.borderColor = focused ? '#c7c7c7' : '#dbdbdb';
  const pon = cleared ? 0 : SV(t - T_PUB_ON, 26, .8), pp = pressAt(t, TAP_PUB);
  $('pub').style.opacity = (.35 + .65 * pon) * (1 - .45 * pp);
  $('pub').style.transform = `scale(${1 - .08 * pp})`;

  // DM banner: drops on « le », its GitHub link line opens on « repo », then holds
  const b = SV(t - T_BAN, 16, .6), lq = S(t - T_LINK, 30);
  // the status bar and the Reels header step aside under the banner
  ['status', 'rtitle', 'rcam'].forEach(id => { $(id).style.opacity = 1 - clamp(b * 1.6); });
  show($('ban1'), b);
  $('ban1').style.height = lerp(BH0, BH1, lq) + 'px';
  $('ban1').style.transform = `translateY(${-120 * (1 - b)}px) scale(${.97 + .03 * b})`;
  $('ban1').style.opacity = clamp(b * 3);
  $('blink').style.opacity = lq; $('blink').style.transform = `translateY(${6 * (1 - lq)}px)`;

  // finger dot + ripples
  const [cx, cy] = curAt(t);
  let press = 0; for (const a of TAPS) press = Math.max(press, pressAt(t, a));
  let vis = 0; for (const [a, bb, c, d] of VIS) vis = Math.max(vis, seg(t, a, bb) - seg(t, c, d));
  show($('dot'), vis);
  $('dot').style.transform = `translate(${cx}px,${cy}px) scale(${1 - .16 * press})`;
  $('dot').style.opacity = vis; $('dot').style.background = `rgba(255,255,255,${.32 + .3 * press})`;
  const rips = TAPS.filter(a => t >= a && t < a + .38).slice(-2);
  [0, 1].forEach(i => {
    const el = $('rip' + i), a = rips[i];
    if (a === undefined) { el.style.display = 'none'; return; }
    const p = out((t - a) / .38), [rx, ry] = curAt(a);
    el.style.display = ''; el.style.transform = `translate(${rx}px,${ry}px) scale(${.45 + .85 * p})`; el.style.opacity = .85 * (1 - p);
  });
  return true;
};
window.setT(0);
</script></body></html>
