<!doctype html><html><head><meta charset="utf-8">
<!-- "tu remplaces ton spinner ennuyeux par une orbe": a Claude panel with three status rows; the cursor clicks each grey
     spinner and the real Thinking Orbs (orbs.js) take its place. Short time 10.61 -> 13.35. Split layout: content y 60..1060. -->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  #panel { position: absolute; left: 60px; top: 96px; width: 960px; height: 920px; border-radius: 44px; background: #FAF9F5;
    border: 1.5px solid #E9E6DC;
    box-shadow: 0 2px 0 rgba(255,255,255,.9) inset, 0 40px 80px -20px rgba(20,20,19,.20), 0 12px 28px rgba(20,20,19,.08), 0 2px 6px rgba(20,20,19,.05); }
  #hd { position: absolute; left: 0; top: 0; width: 960px; height: 168px; border-bottom: 1.5px solid #ECE9DF; }
  #logo { position: absolute; left: 52px; top: 42px; width: 84px; height: 84px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 6px 14px rgba(201,100,66,.25), 0 1px 2px rgba(20,20,19,.10); }
  #logo img { width: 100%; height: 100%; display: block; }
  #name { position: absolute; left: 162px; top: 34px; font-family: "Instrument Serif", Georgia, serif; font-size: 78px; line-height: 100px; color: #141413; letter-spacing: -.5px; }
  #model { position: absolute; right: 52px; top: 56px; height: 56px; padding: 0 26px; border-radius: 28px; background: #F0EEE6;
    font-family: "Inter", sans-serif; font-weight: 500; font-size: 34px; line-height: 56px; color: #73726C; }
  .row { position: absolute; left: 44px; width: 872px; height: 206px; border-radius: 30px; background: #FFFFFF; border: 1.5px solid #E9E6DC;
    box-shadow: 0 10px 24px -8px rgba(20,20,19,.10), 0 2px 4px rgba(20,20,19,.04); }
  .ring { position: absolute; left: 22px; top: 22px; width: 160px; height: 160px; border-radius: 50%; }
  .spin, .orb { position: absolute; left: 22px; top: 22px; width: 160px; height: 160px; }
  .lab { position: absolute; left: 212px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 52px; color: #141413; letter-spacing: -.6px; white-space: nowrap; }
  .sub { position: absolute; left: 212px; font-family: "Inter", sans-serif; font-weight: 400; font-size: 38px; color: #73726C; white-space: nowrap; }
  #cur { position: absolute; left: 0; top: 0; width: 66px; height: 96px; transform-origin: 0 0; filter: drop-shadow(0 6px 8px rgba(0,0,0,.28)); }
</style></head><body>
<div id="panel">
  <div id="hd"><div id="logo"><img src="../assets/logos/claude.png"></div><div id="name">Claude</div><div id="model">Opus</div></div>
</div>
<svg id="cur" viewBox="-3 -3 26 38"><path d="M0 0 L0 28.5 L6.6 22.4 L10.9 32.4 L15.6 30.4 L11.4 20.6 L20.2 20.6 Z" fill="#111" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
<script src="orbs.js"></script>
<script>
const S = (x, w) => x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x);
const lerp = (a, b, f) => a + (b - a) * f;
const mix = (c1, c2, f) => `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], f))).join(',')})`;

// rows: label, sub, orb state, click time
const ROWS = [
  { lab: 'Loading', sub: null, state: 'breathing', c: 0.69 },
  { lab: 'Search', sub: 'Searching 1 204 results', state: 'searching', c: 1.23 },
  { lab: 'Upload', sub: null, state: 'composing', c: 1.71 },
];
const panel = document.getElementById('panel');
const PX = 160, DPR = 2;   // canvas drawn at 2x for crisp dots
ROWS.forEach((r, i) => {
  r.y = 214 + i * 232;
  const el = document.createElement('div'); el.className = 'row'; el.style.top = r.y + 'px';
  el.innerHTML = `<div class="ring"></div><canvas class="spin" width="${PX * DPR}" height="${PX * DPR}"></canvas><canvas class="orb" width="${PX * DPR}" height="${PX * DPR}"></canvas>
    <div class="lab" style="top:${r.sub ? 34 : 70}px;line-height:66px">${r.lab}</div>${r.sub ? `<div class="sub" style="top:110px;line-height:50px">${r.sub}</div>` : ''}`;
  panel.appendChild(el);
  r.el = el; r.ring = el.querySelector('.ring'); r.spin = el.querySelector('.spin'); r.orb = el.querySelector('.orb');
  r.sctx = r.spin.getContext('2d'); r.octx = r.orb.getContext('2d');
  r.preset = ORBS.resolvePreset(r.state, 32);
});

// page coords of each spinner centre (panel 60,96 + row 44,y + 22+80)
ROWS.forEach(r => { r.cx = 60 + 44 + 22 + 80; r.cy = 96 + r.y + 22 + 80; });
// cursor waypoints: [time arrive, x, y] (tip slightly below-right of the spinner centre)
const tip = r => [r.cx + 18, r.cy + 22];
const WP = [
  [0.00, 820, 880],
  [0.55, ...tip(ROWS[0])],
  [0.80, ...tip(ROWS[0])],
  [1.13, ...tip(ROWS[1])],
  [1.30, ...tip(ROWS[1])],
  [1.61, ...tip(ROWS[2])],
  [1.80, ...tip(ROWS[2])],
  [2.25, 800, 930],
];
function cursorAt(t) {
  if (t <= WP[0][0]) return WP[0].slice(1);
  for (let i = 0; i < WP.length - 1; i++) {
    const [t0, x0, y0] = WP[i], [t1, x1, y1] = WP[i + 1];
    if (t < t1 || i === WP.length - 2) {
      const d = t1 - t0, f = Math.min(1, (t - t0) / d);
      // spring-shaped ease in time (no overshoot), normalised to land exactly on the waypoint
      const e = S(f, 7) / S(1, 7);
      return [lerp(x0, x1, e), lerp(y0, y1, e)];
    }
  }
}
const cur = document.getElementById('cur');
const press = x => Math.max(0, S(x, 60) - S(x - 0.09, 34));   // 0 -> 1 -> 0 over ~.2 s, never below 0

function drawSpinner(ctx, ang) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, PX, PX);
  ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.strokeStyle = '#E6E4DC'; ctx.beginPath(); ctx.arc(80, 80, 42, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#A3A19A'; ctx.beginPath(); ctx.arc(80, 80, 42, ang, ang + Math.PI * 0.55); ctx.stroke();
}
function drawOrb(r, t) {
  const { mode, speed, opts } = r.preset, k = PX * DPR / 64;
  r.octx.setTransform(k, 0, 0, k, 0, 0); r.octx.clearRect(0, 0, 64, 64);
  ORBS.paintFrame(r.octx, ORBS.MODE_FRAMES[mode](64, t * speed, opts), false);
}

window.setT = t => {
  // settle .15 s
  const st = S(t + 0.06, 30);
  panel.style.transform = `translateY(${(1 - st) * 14}px)`;
  ROWS.forEach((r, i) => {
    const e = S(t + 0.08 - i * 0.03, 30);
    const p = press(t - r.c);
    const sw = S(t - r.c, 26);                 // spinner out
    const oi = S(t - r.c - 0.02, 20);          // orb in
    const hl = S(t - 2.07 - i * 0.07, 16);     // blue highlight on "orbe"
    r.el.style.transform = `translateY(${(1 - e) * 18}px) scale(${1 - p * 0.012})`;
    r.el.style.background = mix([255, 255, 255], [242, 240, 232], p);
    r.el.style.borderColor = mix([233, 230, 220], [146, 196, 255], hl);
    r.ring.style.background = `rgba(37,142,255,${0.09 * hl})`;
    r.ring.style.transform = `scale(${0.7 + 0.3 * hl})`;
    // spinner: steady boring rotation
    if (sw < 0.999) {
      drawSpinner(r.sctx, t * Math.PI * 2 * 1.05 + i * 1.3);
      r.spin.style.opacity = 1 - sw; r.spin.style.transform = `scale(${1 - 0.35 * sw})`;
      r.spin.style.display = '';
    } else r.spin.style.display = 'none';
    if (oi > 0.001) {
      drawOrb(r, t);
      r.orb.style.opacity = oi; r.orb.style.transform = `scale(${0.72 + 0.28 * oi})`;
      r.orb.style.display = '';
    } else r.orb.style.display = 'none';
  });
  // cursor
  const [x, y] = cursorAt(t);
  const pr = ROWS.reduce((m, r) => Math.max(m, press(t - r.c)), 0);
  cur.style.transform = `translate(${x - 7.6}px, ${y - 7.6}px) scale(${1 - 0.14 * pr})`;
};
setT(0);
</script></body></html>
