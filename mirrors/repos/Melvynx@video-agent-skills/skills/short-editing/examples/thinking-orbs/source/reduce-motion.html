<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  #orb { position: absolute; left: 265px; top: 120px; width: 550px; height: 550px; }
  #ring { position: absolute; left: 240px; top: 95px; width: 600px; height: 600px; }
  .win {
    position: absolute; left: 60px; top: 722px; width: 960px; height: 530px;
    background: #FFFFFF; border-radius: 32px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(17,17,17,.06), 0 2px 6px rgba(17,17,17,.06), 0 24px 52px rgba(17,17,17,.13);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    color: #111111;
  }
  .bar { position: absolute; left: 0; top: 0; width: 100%; height: 116px; display: flex; align-items: center; border-bottom: 2px solid rgba(17,17,17,.07); background: #FBFBFB; }
  .tl { width: 26px; height: 26px; border-radius: 50%; margin-left: 16px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .tl:first-child { margin-left: 38px; }
  .chev { margin-left: 46px; width: 104px; display: flex; justify-content: space-between; }
  .chev svg { width: 34px; height: 40px; }
  .title { margin-left: 26px; font-size: 40px; font-weight: 700; letter-spacing: -.3px; }
  .group { position: absolute; left: 40px; top: 152px; width: 880px; background: #F5F5F7; border-radius: 22px; box-shadow: inset 0 0 0 2px rgba(17,17,17,.05); }
  .row { position: relative; height: 112px; display: flex; align-items: center; padding: 0 30px 0 36px; font-size: 38px; font-weight: 500; letter-spacing: -.2px; }
  .row + .row::before { content: ''; position: absolute; left: 36px; right: 30px; top: 0; height: 2px; background: rgba(17,17,17,.08); }
  .sw { position: absolute; right: 30px; top: 28px; width: 96px; height: 56px; border-radius: 28px; }
  .knob { position: absolute; top: 3px; left: 3px; width: 50px; height: 50px; border-radius: 50%; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,.10), 0 3px 8px rgba(0,0,0,.20); }
  #cur { position: absolute; left: 0; top: 0; width: 70px; height: 108px; transform-origin: 6px 6px; }
</style>
</head>
<body>
<canvas id="orb" width="550" height="550"></canvas>
<canvas id="ring" width="600" height="600"></canvas>
<div class="win" id="win">
  <div class="bar">
    <div class="tl" style="background:#FF5F57"></div><div class="tl" style="background:#FEBC2E"></div><div class="tl" style="background:#28C840"></div>
    <div class="chev">
      <svg viewBox="0 0 34 40"><path d="M22 6 L9 20 L22 34" fill="none" stroke="#3A3A3A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 34 40"><path d="M12 6 L25 20 L12 34" fill="none" stroke="#B5B5B8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="title">Affichage</div>
  </div>
  <div class="group">
    <div class="row">Augmenter le contraste<div class="sw" style="background:#E2E2E5"><div class="knob"></div></div></div>
    <div class="row">Réduire la transparence<div class="sw" style="background:#E2E2E5"><div class="knob"></div></div></div>
    <div class="row">Réduire les animations<div class="sw" id="sw"><div class="knob" id="knob"></div></div></div>
  </div>
</div>
<svg id="cur" viewBox="0 0 28 43">
  <defs><filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <path filter="url(#sh)" d="M2 2 L2 33 L9.2 26.2 L14 37.6 L19.4 35.3 L14.7 24.2 L24.6 24.2 Z" fill="#111111" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
<script src="orbs.js"></script>
<script>
const S = (x, w) => x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x);
const $ = id => document.getElementById(id);
const orb = $('orb').getContext('2d'), ring = $('ring').getContext('2d');
const P = ORBS.resolvePreset('searching', 64);
const CLICK = 1.40, OFF = 0.2;   // OFF: the scan band sits centered at the freeze frame (orb clock 1.6)

function drawOrb(t) {
  const ts = Math.min(t, CLICK) + OFF;   // frozen from the click on: same frame forever
  const k = 550 / 64;
  orb.setTransform(k, 0, 0, k, 0, 0); orb.clearRect(0, 0, 64, 64);
  ORBS.paintFrame(orb, ORBS.MODE_FRAMES[P.mode](64, ts * P.speed, P.opts), false);
}
function drawRing(t) {
  ring.setTransform(1, 0, 0, 1, 0, 0); ring.clearRect(0, 0, 600, 600);
  const p = S(t - 1.81, 22);
  if (p <= 0.001) return;
  ring.strokeStyle = '#258EFF'; ring.lineWidth = 8; ring.lineCap = 'round';
  ring.beginPath(); ring.arc(300, 300, 268, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ring.stroke();
}
const lerp = (a, b, f) => a + (b - a) * f;
function mix(c1, c2, f) { return `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], f))).join(',')})`; }

// toggle center in page coords: win 60,722 + group 40,152 + row 3 (224 + 56) ; switch right edge 30 in
const TX = 60 + 40 + 880 - 30 - 48, TY = 722 + 152 + 224 + 56;
const C0 = [600, 1010], C1 = [TX - 16, TY + 4];
const ease = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

window.setT = function (t) {
  const w = S(t, 34);
  $('win').style.transform = `translateY(${((1 - w) * 16).toFixed(2)}px)`;
  drawOrb(t); drawRing(t);
  // cursor: glides from the window center to the toggle (eased, no overshoot), presses on "réduit"
  const m = ease(0.5, 1.3, t);
  const x = lerp(C0[0], C1[0], m), y = lerp(C0[1], C1[1], m) - Math.sin(m * Math.PI) * 40;
  const press = Math.max(0, 1 - Math.abs(t - CLICK - 0.02) / 0.07);
  const sc = 1 - 0.12 * Math.min(1, press);
  const cin = S(t - 0.3, 18);
  $('cur').style.opacity = cin.toFixed(3);
  $('cur').style.transform = `translate(${(x - 6).toFixed(2)}px, ${(y - 6).toFixed(2)}px) scale(${sc.toFixed(3)})`;
  // toggle
  const k = S(t - CLICK, 24);
  $('knob').style.transform = `translateX(${(k * 40).toFixed(2)}px)`;
  $('sw').style.background = mix([226, 226, 229], [37, 142, 255], k);
};
setT(0);
</script>
</body>
</html>
