<script>
const $ = id => document.getElementById(id);
const S = (x, w) => x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const L = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = cl((x - a) / (b - a)); return k * k * (3 - 2 * k); };

// file list: 4 folders, then README.md and LICENSE
const FOLDER = '<svg class="ico" width="36" height="36" viewBox="0 0 16 16" fill="#54AEFF"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg>';
const FILE = '<svg class="ico" width="36" height="36" viewBox="0 0 16 16" fill="#59636E"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>';
const FILES = [[FOLDER, 'scripts-reels'], [FOLDER, 'montage-auto'], [FOLDER, 'dm-instagram'], [FOLDER, 'viralite'], [FILE, 'README.md'], [FILE, 'LICENSE']];
$('rows').innerHTML = FILES.map((f, i) =>
  `<div class="fr" id="f${i}" style="top:${60 + i * 58}px">${i ? '<i class="sep"></i>' : ''}<span class="in" id="fi${i}">${f[0]}<span>${f[1]}</span></span></div>`).join('');

// final window rect (stage) and the card rect it starts from
const CARD = { x: 90, y: 380, w: 900, h: 300, r: 44 };
const WIN = { x: 60, y: 150, w: 960, hh: 166, h: 876, r: 26 };
const INK = [20, 22, 27], HDR = [246, 248, 250];

// box-shadow: the engine's sheet shadow under the ink card (depth 1.7, elev 1) -> a tighter deep one under the window
const SH0 = [[0, 38, 144, 0, .049], [0, 17.5, 67, 0, .187], [0, 2, 7.7, 0, .119], [0, .8, 2, 0, .063]];
const SH1 = [[0, 22, 44, -12, .17], [0, 12, 24, -6, .22], [0, 2, 6, 0, .12], [0, 0, 0, 1.5, .10]];
const shadow = k => SH0.map((a, i) => { const b = SH1[i], v = a.map((x, j) => L(x, b[j], k));
  return `${v[0]}px ${v[1].toFixed(2)}px ${v[2].toFixed(2)}px ${v[3].toFixed(2)}px rgba(40,28,10,${v[4].toFixed(3)})`; }).join(', ');

// offset of an element inside #win (layout units, unaffected by transforms)
function offIn(el) { let x = 0, y = 0; for (let e = el; e && e.id !== 'win'; e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; } return [x, y]; }
const fade = (el, k, dy = 18) => { el.style.opacity = k; el.style.transform = (el.dataset.base || '') + ` translateY(${(1 - k) * dy}px)`; };
['path', 'title', 'who', 'commits', 'mit'].forEach(id => $(id).dataset.base = 'translateY(-50%)');

let T0w = 0;
window.setT = function (t) {
  // whip out to the left, 2.05 -> 2.17
  const u = cl((t - 2.05) / 0.12);
  $('all').style.transform = `translateX(${-1150 * u * u}px)`;

  // 1. the ink card enters at .41 exactly like the engine board item (rise 40, alpha min(1, 1.35 p), spring 13)
  const p = S(t - 0.41, 13), ca = Math.min(1, p * 1.35);
  // 3. morph .95 -> ~1.2: the card glides up and shrinks into the repo header, then the page unfolds under it
  const m = S(t - 0.95, 20), g = S(t - 1.0, 16);
  const hh = L(CARD.h, WIN.hh, m), bodyH = (WIN.h - WIN.hh) * g;
  const x = L(CARD.x, WIN.x, m), y = L(CARD.y, WIN.y, m) + 40 * (1 - p), w = L(CARD.w, WIN.w, m), r = L(CARD.r, WIN.r, m);
  const W_ = $('win');
  W_.style.left = x + 'px'; W_.style.top = y + 'px'; W_.style.width = w + 'px'; W_.style.height = (hh + bodyH) + 'px';
  W_.style.borderRadius = r + 'px'; W_.style.opacity = ca; W_.style.boxShadow = shadow(m);
  const hk = ss(0.3, 0.62, m), hc = INK.map((c, i) => Math.round(L(c, HDR[i], hk)));
  const H = $('hdr'); H.style.height = hh + 'px'; H.style.background = `rgb(${hc})`;
  $('lit').style.opacity = 1 - ss(0, 0.5, m);
  $('hline').style.top = (hh - 2) + 'px'; $('hline').style.opacity = ss(0.6, 1, m);

  // 2. Instagram logo (pop .5 -> 1) and the title (rise), both from .50; during the morph they fly into the header:
  //    the Instagram icon onto the GitHub mark, the title onto the repo name of the path
  const q = S(t - 0.50, 13), qa = Math.min(1, q * 1.35);
  const mf = S(t - 0.95, 27);                         // the flyers travel a bit faster than the window so they land on it
  const fx = x, fy = y;                               // current window origin: the flyers land on the moving header
  const [ox, oy] = [fx + 118 + 32, fy + 16 + 32];     // GitHub mark centre
  const igx = L(245, ox, mf), igy = L(530, oy, mf) + 40 * (1 - q), igs = L(0.5, 1, q) * L(1, 64 / 150, mf);
  const IG = $('ig'); IG.style.transform = `translate(${igx - 245}px, ${igy - 530}px) scale(${igs})`;
  IG.style.opacity = qa * (1 - ss(0.7, 0.97, mf));
  $('octo').style.opacity = ss(0.7, 0.97, mf);

  const pn = $('pathName'), pw = pn.offsetWidth, sr = $('stage').getBoundingClientRect(), pr = pn.getBoundingClientRect(), k0 = 1080 / sr.width;
