name: degardis-authoring
format_version: 2
version: 2.0.0
license: MIT
copyright: Copyright (c) 2026 Kambiz Khojasteh
description: Author Degardis skills by carrying out requests about the Degardis format and compiler or about a skill's Degardis source, bundle, or behavior, grounded in the effective compiler and supplied evidence. Installing, replacing, publishing, or releasing bundles is outside this skill.
principles:
- resumable-stopping
- decision-provenance
- bounded-delegation
- coordinating-delegated-work
- durable-state
- complete-enumeration
- authority-before-effect
- claim-status
- completion-evidence
- proportionate-effort
- source-authority
- reader-first-reporting
- decision-relevant-questions
- sensitive-material
- instruction-authority
- cold-reader-derivation
tasks:
- create
- review
- evaluate
- plan
- revise
- package
- describe
- explain
content:
  tasks:
  - tasks/*.md
  principles:
  - principles/*.md
  knowledge:
  - knowledge/*.md
  guides:
  - guides/*.md
interface:
  display_name: Degardis Authoring
  short_description: Author Degardis skills, from format questions to built bundles
  default_prompt: Use degardis-authoring to review this Degardis skill source for defects.
