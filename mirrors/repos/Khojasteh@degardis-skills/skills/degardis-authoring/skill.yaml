name: degardis-authoring
format_version: 2
version: 2.1.0
license: MIT
copyright: Copyright (c) 2026 Kambiz Khojasteh
description: "Write, review, plan, revise, and build Degardis skill source, and explain the format, compiler, and authoring choices. Describe or test any skill, with or without its source. Installing, replacing, publishing, or releasing bundles is outside this skill."
principles:
- authority-before-effect
- claim-status
- completion-evidence
- proportionate-effort
- source-authority
- resumable-stopping
- decision-provenance
- bounded-delegation
- coordinating-delegated-work
- durable-state
- complete-enumeration
- reader-first-reporting
- self-standing-artifacts
- decision-relevant-questions
- sensitive-material
- instruction-authority
- cold-reader-derivation
tasks:
- create
- review
- evaluate
- plan
- revise
- package
- describe
- explain
content:
  tasks:
  - tasks/*.md
  principles:
  - principles/*.md
  knowledge:
  - knowledge/*.md
  guides:
  - guides/*.md
interface:
  display_name: Degardis Authoring
  short_description: Author and build Degardis skills; describe or test any skill
  default_prompt: Use degardis-authoring to review this Degardis skill source for defects.
