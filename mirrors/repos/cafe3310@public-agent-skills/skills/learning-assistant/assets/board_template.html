<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>学习看板</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 仅保留核心状态色彩映射与极简呼吸动画 */
        .topic-item.completed .topic-dot { background: #2ed573; }
        .topic-item.active .topic-dot { background: #ffa502; animation: pulse-minimal 2s infinite; }
        
        .concept-item.completed .concept-dot { background: #2ed573; }
        .concept-item.active .concept-dot { background: #ffa502; }
        .concept-item.active .concept-label { font-weight: 500; color: #ff7f50; }
        .concept-item.pending .concept-label { color: #a4b0be; }

        @keyframes pulse-minimal {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        /* D3 元素特定 CSS */
        .node text { pointer-events: none; font-size: 11px; fill: #666; font-weight: 300; }
        .link { stroke: #94a3b8; stroke-opacity: 0.8; stroke-width: 1.8px; }
    </style>
</head>
<body class="flex h-screen bg-[#fbfbfb] text-[#1a1a1a] antialiased overflow-hidden">
    <!-- 左侧面板: 知识地图 -->
    <div id="mid-panel" class="w-[380px] bg-[#fbfbfb] overflow-y-auto px-6 py-8 border-r border-[#f0f0f0] shrink-0">
        <h2 class="text-[14px] font-semibold tracking-wider uppercase pb-2.5 border-b border-[#e8e8e8] text-[#1e272e] mb-6">
            知识地图
        </h2>
        <div class="subway-container" id="subway-items"></div>
    </div>

    <!-- 右侧面板: 力导向画板 -->
    <div id="left-panel" class="flex-1 relative bg-white h-full overflow-hidden">
        <!-- 图例 (legend) -->
        <div class="legend absolute bottom-6 left-6 bg-white/90 border border-[#eef0f2] rounded p-3 text-[10px] text-[#747d8c] z-10 space-y-1.5 shadow-sm">
            <div class="legend-item flex items-center"><div class="legend-color w-2.5 h-2.5 mr-2 rounded-full" style="background: #9b59b6;"></div> 学习目录</div>
            <div class="legend-item flex items-center"><div class="legend-color w-2.5 h-2.5 mr-2 rounded-full" style="background: #1e272e;"></div> 学习主题</div>
            <div class="legend-item flex items-center"><div class="legend-color w-2.5 h-2.5 mr-2 rounded-full" style="background: #3498db;"></div> 任务节点</div>
            <div class="legend-item flex items-center"><div class="legend-color w-2.5 h-2.5 mr-2 rounded-full" style="background: #2ed573;"></div> 已完成概念</div>
            <div class="legend-item flex items-center"><div class="legend-color w-2.5 h-2.5 mr-2 rounded-full" style="background: #ffa502;"></div> 进行中概念</div>
        </div>
        <div id="viz" class="w-full h-full"></div>
    </div>

    <!-- 提示框 (tooltip) -->
    <div class="tooltip absolute opacity-0 pointer-events-none p-3 bg-white/98 border border-[#eef0f2] rounded text-[11px] max-w-[260px] shadow-sm z-50 leading-relaxed transition-opacity duration-300" id="tooltip"></div>

    <script>
        function getSafeId(str) {
            if (!str) return "";
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return "id-" + Math.abs(hash);
        }

        let nodesData = [];
        let linksData = [];
        let oldNodeIds = new Set();
        let oldLinkIds = new Set();
        let oldSubwayIds = new Set();
        let oldTopicIds = new Set();
        
        let subwayRevealQueue = [];
        let graphRevealQueue = [];
        let isRevealingSubway = false;
        let isRevealingGraph = false;

        async function processSubwayRevealQueue(isInitialQueue = false) {
            if (isRevealingSubway) return;
            isRevealingSubway = true;
            while (subwayRevealQueue.length > 0) {
                let task = subwayRevealQueue.shift();
                task();
                if (subwayRevealQueue.length > 0) {
                    let delay = isInitialQueue ? 50 : (500 + Math.random() * 1000); 
                    await new Promise(r => setTimeout(r, delay));
                }
            }
            isRevealingSubway = false;
        }

        async function processGraphRevealQueue(isInitialQueue = false) {
            if (isRevealingGraph) return;
            isRevealingGraph = true;
            while (graphRevealQueue.length > 0) {
                let task = graphRevealQueue.shift();
                task();
                if (graphRevealQueue.length > 0) {
                    let delay = isInitialQueue ? 50 : (500 + Math.random() * 1000); 
                    await new Promise(r => setTimeout(r, delay));
                }
            }
            isRevealingGraph = false;
        }

        const panel = document.getElementById("left-panel");
        const width = panel.clientWidth, height = panel.clientHeight;

        const svg = d3.select("#viz").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        const zoom = d3.zoom().scaleExtent([0.1, 4]).on("zoom", (event) => {
            container.attr("transform", event.transform);
        });
        svg.call(zoom);

        const container = svg.append("g");

        // Define filter for glow effect
        const defs = svg.append("defs");
        const filter = defs.append("filter").attr("id", "glow");
        filter.append("feGaussianBlur").attr("stdDeviation", "3.5").attr("result", "coloredBlur");
        const feMerge = filter.append("feMerge");
        feMerge.append("feMergeNode").attr("in", "coloredBlur");
        feMerge.append("feMergeNode").attr("in", "SourceGraphic");

        const linkGroup = container.append("g").attr("class", "links");
        const nodeGroup = container.append("g").attr("class", "nodes");
        
        let simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id).distance(d => d.source.type === 'Topic' ? 80 : 120))
            .force("charge", d3.forceManyBody().strength(-500))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(50));

        function getNodeColor(d) {
            if (d.type === "Root") return "#9b59b6"; // 紫色
            if (d.type === "Learning Subject") return "#1e272e"; // 炭黑
            if (d.type === "Topic") return "#3498db";
            if (d.status === "completed") return "#2ed573";
            if (d.status === "active") return "#ffa502";
            return "#e0e0e0";
        }

        function updateDashboard(data, isInitial = false) {
            if (!data || !data.nodes) return;

            // Subway Updates
            const subwayContainer = document.getElementById("subway-items");
            data.subway.forEach(st => {
                let subjectId = `subway-subject-${getSafeId(st.original_name)}`;
                let subjectEl = document.getElementById(subjectId);
                if (!subjectEl) {
                    subjectEl = document.createElement("div");
                    subjectEl.id = subjectId;
                    subjectEl.className = "mb-8 pl-4 border-l-2 border-[#2f3542]";
                    subjectEl.innerHTML = `
                        <div class="flex items-center mb-3">
                            <span class="font-bold text-[13px] text-[#1e272e] tracking-wider uppercase">${st.subject}</span>
                        </div>
                        <div class="space-y-4" id="topics-${subjectId}"></div>
                    `;
                    subwayContainer.appendChild(subjectEl);
                }
                
                const topicListContainer = document.getElementById(`topics-${subjectId}`);
                
                st.topics.forEach(t => {
                    let topicId = `subway-topic-${getSafeId(t.original_name)}`;
                    let topicEl = document.getElementById(topicId);
                    
                    if (!topicEl) {
                        topicEl = document.createElement("div");
                        topicEl.id = topicId;
                        topicEl.className = `subway-item topic-item relative ${t.status}`;
                        topicEl.innerHTML = `
                            <div class="topic-header flex items-center mb-2">
                                <div class="topic-dot w-2 h-2 rounded-sm bg-[#a4b0be] mr-3 shrink-0 transition-colors duration-300"></div>
                                <div class="topic-label text-[13px] font-medium text-[#2f3542]">${t.topic}</div>
                            </div>
                            <div class="concept-list pl-3.5 border-l border-[#e8e8e8] ml-[3px] space-y-1.5" id="list-${topicId}"></div>
                        `;
                        topicEl.style.opacity = 0;
                        topicEl.style.transform = "translateX(-20px)";
                        topicEl.style.transition = "all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                        topicListContainer.appendChild(topicEl);
                        
                        subwayRevealQueue.push(() => {
                            topicEl.style.opacity = 1;
                            topicEl.style.transform = "translateX(0)";
                        });
                    } else {
                        topicEl.className = `subway-item topic-item relative ${t.status}`;
                    }
                    
                    const conceptList = document.getElementById(`list-${topicId}`);
                    const statusOrder = { "completed": 0, "active": 1, "pending": 2 };
                    const sortedConcepts = [...t.concepts].sort((a, b) => {
                        return (statusOrder[a.status] !== undefined ? statusOrder[a.status] : 9) - (statusOrder[b.status] !== undefined ? statusOrder[b.status] : 9);
                    });
                    sortedConcepts.forEach(c => {
                        let conceptId = `subway-concept-${getSafeId(c.name)}`;
                        let conceptEl = document.getElementById(conceptId);
                        
                        if (!conceptEl) {
                            conceptEl = document.createElement("div");
                            conceptEl.id = conceptId;
                            conceptEl.className = `concept-item flex items-center text-[11px] ${c.status}`;
                            conceptEl.innerHTML = `<div class="concept-dot w-1.5 h-1.5 rounded-full bg-[#e0e0e0] mr-2.5 transition-colors duration-300"></div><div class="concept-label transition-colors duration-300">${c.name}</div>`;
                            
                            conceptEl.style.opacity = 0;
                            conceptEl.style.transform = "translateX(-20px)";
                            conceptEl.style.transition = "all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                            conceptList.appendChild(conceptEl);
                            
                            subwayRevealQueue.push(() => {
                                conceptEl.style.opacity = 1;
                                conceptEl.style.transform = "translateX(0)";
                            });
                        } else {
                            conceptEl.className = `concept-item flex items-center text-[11px] ${c.status}`;
                        }
                    });
                });
            });

            // Graph Updates
            let newNodesAdded = false;
            
            data.nodes.forEach(nn => {
                let existing = nodesData.find(d => d.id === nn.id);
                if (existing) {
                    existing.status = nn.status;
                    existing.info = nn.info;
                } else {
                    newNodesAdded = true;
                    nn.x = width / 2 + (Math.random() - 0.5) * 100;
                    nn.y = height / 2 + (Math.random() - 0.5) * 100;
                    nodesData.push(nn);
                }
            });

            data.links.forEach(nl => {
                let key = nl.source + "-" + nl.target;
                if (!oldLinkIds.has(key)) {
                    oldLinkIds.add(key);
                    linksData.push(nl);
                }
            });

            let nodeSelection = nodeGroup.selectAll(".node-group").data(nodesData, d => d.id);
            let nodeEnter = nodeSelection.enter().append("g")
                .attr("class", "node-group")
                .attr("id", d => `node-${getSafeId(d.id)}`)
                .style("opacity", 0)
                .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended));

            nodeEnter.append("path")
                .attr("d", d => {
                    if (d.type === "Root") return d3.symbol().type(d3.symbolCircle).size(1400)(); // 根节点使用超大圆形
                    if (d.type === "Learning Subject") return d3.symbol().type(d3.symbolCircle).size(900)(); // 主题节点大圆形
                    if (d.type === "Topic") return d3.symbol().type(d3.symbolCircle).size(450)(); // 任务节点中等圆形
                    return d3.symbol().type(d3.symbolCircle).size(200)(); // 概念节点小圆形
                })
                .attr("stroke-width", d => d.status === "active" ? 4 : 2);

            nodeEnter.append("text")
                .attr("dx", 18).attr("dy", ".35em")
                .text(d => d.label)
                .style("font-weight", d => d.type === "Topic" ? "bold" : "normal")
                .style("fill", "#333");

            let nodeMerge = nodeEnter.merge(nodeSelection);
            
            nodeMerge.select("path").transition().duration(800)
                .attr("fill", getNodeColor)
                .attr("stroke", d => d.status === "active" ? "#ffa502" : "#fff")
                .attr("stroke-width", d => d.status === "active" ? 4 : 2)
                .style("filter", d => d.status === "active" ? "url(#glow)" : "none");

            const tooltip = d3.select("#tooltip");
            const typeMap = {
                "Root": "学习目录",
                "Learning Subject": "学习主题",
                "Topic": "任务节点",
                "Concept": "知识概念",
                "学习日志": "学习日志"
            };

            let linkSelection = linkGroup.selectAll(".link").data(linksData, d => (d.source.id || d.source) + "-" + (d.target.id || d.target));
            let linkEnter = linkSelection.enter().append("line")
                .attr("class", "link")
                .attr("id", d => `link-${getSafeId(d.source.id || d.source)}-${getSafeId(d.target.id || d.target)}`)
                .style("opacity", 0);
            
            let linkMerge = linkEnter.merge(linkSelection);

            // Bind interactions after linkMerge is defined
            nodeMerge.on("mouseover", (event, d) => {
                tooltip.transition().duration(100).style("opacity", 1);
                tooltip.html(`<strong>${d.label}</strong> <span style="color:#95a5a6; font-size:10px;">• ${typeMap[d.type] || d.type}</span><hr style="margin:10px 0; border:0; border-top:1px solid #f0f0f0;">${d.info}`)
                    .style("left", (event.pageX + 15) + "px").style("top", (event.pageY - 20) + "px");

                // Highlight directly connected links and dim others
                linkMerge.transition().duration(150)
                    .style("stroke", l => {
                        const sId = l.source.id || l.source;
                        const tId = l.target.id || l.target;
                        return (sId === d.id || tId === d.id) ? "#475569" : "#cbd5e1";
                    })
                    .style("stroke-opacity", l => {
                        const sId = l.source.id || l.source;
                        const tId = l.target.id || l.target;
                        return (sId === d.id || tId === d.id) ? 1.0 : 0.15;
                    })
                    .style("stroke-width", l => {
                        const sId = l.source.id || l.source;
                        const tId = l.target.id || l.target;
                        return (sId === d.id || tId === d.id) ? "2.4px" : "1.2px";
                    });

                // Highlight directly connected nodes and dim others
                nodeMerge.transition().duration(150)
                    .style("opacity", n => {
                        if (n.id === d.id) return 1.0;
                        const connected = linksData.some(l => {
                            const sId = l.source.id || l.source;
                            const tId = l.target.id || l.target;
                            return (sId === d.id && tId === n.id) || (sId === n.id && tId === d.id);
                        });
                        return connected ? 0.95 : 0.25;
                    });
            }).on("mouseout", () => {
                tooltip.transition().duration(500).style("opacity", 0);

                // Reset styling
                linkMerge.transition().duration(150)
                    .style("stroke", null)
                    .style("stroke-opacity", null)
                    .style("stroke-width", null);

                nodeMerge.transition().duration(150)
                    .style("opacity", 1.0);
            });

            simulation.nodes(nodesData);
            simulation.force("link").links(linksData);
            
            if (isInitial || newNodesAdded) {
                simulation.alpha(isInitial ? 1 : 0.3).restart();
                
                if (newNodesAdded && !isInitial) {
                    d3.select("#viz svg").transition().duration(2000).call(zoom.scaleBy, 0.85);
                }

                data.nodes.forEach(nn => {
                    if (!oldNodeIds.has(nn.id)) {
                        oldNodeIds.add(nn.id);
                        graphRevealQueue.push(() => {
                            d3.select(`#node-${getSafeId(nn.id)}`)
                              .transition().duration(800).style("opacity", 1);
                            linkMerge.filter(l => (l.source.id || l.source) === nn.id || (l.target.id || l.target) === nn.id)
                                     .transition().duration(800).style("opacity", 1);
                        });
                    }
                });
            }

            processSubwayRevealQueue(isInitial);
            processGraphRevealQueue(isInitial);

            simulation.on("tick", () => {
                linkMerge.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                nodeMerge.attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        // Initialize static data
        const initialData = __INJECTED_DATA__;
        updateDashboard(initialData, true);

        function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
        function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
        function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
        window.addEventListener('resize', () => {
            const w = panel.clientWidth, h = panel.clientHeight;
            d3.select("svg").attr("width", w).attr("height", h);
        });
    </script>
</body>
</html>
