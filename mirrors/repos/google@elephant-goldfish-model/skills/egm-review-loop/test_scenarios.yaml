skill: "egm-review-loop"
description: "Behavioral evaluation scenario suite for egm-review-loop skill."

scenarios:
  - scenario_id: "orchestrate_parallel_critiques"
    description: "Verifies review persona orchestration and findings compilation."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review-loop/SKILL.md"
    turns:
      - user_input: "Orchestrate multi-perspective Goldfish review on docs/design.md."
        assertions:
          - type: "required_pattern"
            pattern: "(Review|Goldfish|findings|persona|comprehension|critic)"
            message: "Review loop orchestrator must acknowledge review personas and structured findings compilation."
