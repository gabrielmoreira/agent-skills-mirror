expected_outcome: |
  The run first adds a regression test for "1h30m" to the existing tests/test_duration.py (the repo
  keeps tests in tests/, so not beside the module), runs it and sees it fail with 1800, then fixes the
  accumulation bug in timeparse/duration.py. It notices that test_two_hours_fifteen expects 900 for
